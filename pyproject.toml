[project]
name = "mini-code-agent"
version = "0.1.0"
description = "一个最小可用的 coding agent，基于 Anthropic Messages API。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "ipykernel>=7.4.0",
    "python-dotenv>=1.2.4",
    "typer>=0.27.3",
]

[project.scripts]
mini-code-agent = "mini_code_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_code_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
